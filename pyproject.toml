[project]
name = "retail-pricing"
version = "0.1.0"
description = "Reproducible retail analytics engineering from PostgreSQL to dimensional Gold"
readme = "README.md"
authors = [
    { name = "diogovasconcelosmerca", email = "diogovasconcelosmerca@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["retail_pricing"]
