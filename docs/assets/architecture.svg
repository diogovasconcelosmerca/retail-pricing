<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 320" role="img" aria-labelledby="title desc">
<title id="title">Architecture: Raw, Silver and Gold layers feeding a Power BI semantic model</title>
<desc id="desc">Read-only PostgreSQL extraction creates seven Raw Parquet files. Silver publishes nine datasets with contracts and lineage. Gold publishes the Belgian client mart: six dimensions, one bridge and two facts. A Power BI semantic model with DAX measures and a report reads the Gold files.</desc>
